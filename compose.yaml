name: cestmoitia-portfolio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tia
      POSTGRES_USER: tia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tia -d tia"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
